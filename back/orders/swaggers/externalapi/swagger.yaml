openapi: 3.0.0
info:
    title: orders
    version: 0.0.1
servers:
    - {}
paths:
    /api/v1/cart:
        get:
            tags:
                - OrdersAPI
            summary: Получение корзины
            description: Получение текущей корзины клиента
            parameters:
                - in: header
                  name: X-User-Id
                  required: true
                  schema:
                    type: string
                    format: uuid
                - in: query
                  name: clientID
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors: {}
                                    data:
                                        example: true
                                    error:
                                        type: boolean
                                        example: false
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        type: object
                                        properties:
                                            errors:
                                                type: array
                                                items:
                                                    type: object
                                                    properties:
                                                        params:
                                                            type: object
                                                            example:
                                                                "1": value one
                                                                "2": value two
                                                            additionalProperties:
                                                                type: string
                                                        trKey:
                                                            type: string
                                                nullable: true
                                        description: Текст ошибки, при ответе
                                    data: {}
                                    error:
                                        type: boolean
                                        example: true
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                                        example: content.api.errors.auth.badRequest
                                        description: Заголовок ошибки
                "401":
                    description: Unauthorized
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        description: Текст ошибки, при ответе, со статус кодом 403, не указывается
                                    data: {}
                                    error:
                                        type: boolean
                                        example: true
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                                        example: content.api.errors.auth.accessDenied
                                        description: Заголовок ошибки
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        description: Текст ошибки, при ответе, со статус кодом 403, не указывается
                                    data: {}
                                    error:
                                        type: boolean
                                        example: true
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                                        example: content.api.errors.auth.internalError
                                        description: Заголовок ошибки
components:
    schemas:
        requestOrdersAPIGetCart:
            type: object
        responseOrdersAPIGetCart:
            type: object
            required:
                - '-'
            description: Получение текущей корзины клиента
