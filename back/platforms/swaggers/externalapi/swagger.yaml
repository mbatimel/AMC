components:
    schemas:
        models.CreateOzonCardResponse:
            type: object
            properties:
                accepted:
                    type: boolean
                offer_id:
                    type: string
                task_id:
                    type: number
                    format: int64
        models.CreateWildberriesCardResponse:
            type: object
            properties:
                accepted:
                    type: boolean
                subject_id:
                    type: number
                    format: int
                vendor_code:
                    type: string
        models.CreateYandexMarketCardResponse:
            type: object
            properties:
                accepted:
                    type: boolean
                offer_id:
                    type: string
                warnings:
                    type: array
                    items:
                        type: string
                    nullable: true
        models.OzonAttribute:
            type: object
            properties:
                complex_id:
                    type: number
                    format: int
                id:
                    type: number
                    format: int
                values:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.OzonAttributeValue'
                    nullable: true
        models.OzonAttributeValue:
            type: object
            properties:
                dictionary_value_id:
                    type: number
                    format: int64
                value:
                    type: string
        models.OzonDimensions:
            type: object
            properties:
                depth_mm:
                    type: number
                    format: int
                dimension_unit:
                    type: string
                height_mm:
                    type: number
                    format: int
                weight:
                    type: number
                    format: int
                weight_unit:
                    type: string
                width_mm:
                    type: number
                    format: int
        models.WildberriesCharacteristic:
            type: object
            properties:
                id:
                    type: number
                    format: int
                value_json:
                    type: string
        models.WildberriesDimensions:
            type: object
            properties:
                height_cm:
                    type: number
                    format: int
                length_cm:
                    type: number
                    format: int
                weight_brutto_kg:
                    type: number
                    format: float
                width_cm:
                    type: number
                    format: int
        models.WildberriesDocumentItem:
            type: object
            properties:
                applicant:
                    type: string
                end_date:
                    type: string
                is_endless:
                    type: boolean
                number:
                    type: string
                product_number:
                    type: string
                start_date:
                    type: string
                trade_name:
                    type: string
                type:
                    type: number
                    format: int
        models.WildberriesDocuments:
            type: object
            properties:
                exclude_documents:
                    type: boolean
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.WildberriesDocumentItem'
                    nullable: true
        models.WildberriesSize:
            type: object
            properties:
                price:
                    type: number
                    format: float
                skus:
                    type: array
                    items:
                        type: string
                    nullable: true
                tech_size:
                    type: string
                wb_size:
                    type: string
        models.YandexMarketDimensions:
            type: object
            properties:
                height_cm:
                    type: number
                    format: float
                length_cm:
                    type: number
                    format: float
                weight_kg:
                    type: number
                    format: float
                width_cm:
                    type: number
                    format: float
        models.YandexMarketParameterValue:
            type: object
            properties:
                parameter_id:
                    type: number
                    format: int64
                unit_id:
                    type: number
                    format: int64
                value:
                    type: string
                value_id:
                    type: number
                    format: int64
        requestPlatformsAPICreateOzonCard:
            type: object
            required:
                - productID
                - offerID
                - name
                - descriptionCategoryID
                - typeID
                - currencyCode
                - price
                - oldPrice
                - vat
                - barcode
                - dimensions
                - images
                - primaryImage
                - colorImage
                - attributes
            properties:
                attributes:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.OzonAttribute'
                    nullable: true
                barcode:
                    type: string
                colorImage:
                    type: string
                currencyCode:
                    type: string
                descriptionCategoryID:
                    type: number
                    format: int64
                dimensions:
                    $ref: '#/components/schemas/models.OzonDimensions'
                images:
                    type: array
                    items:
                        type: string
                    nullable: true
                name:
                    type: string
                offerID:
                    type: string
                oldPrice:
                    type: string
                price:
                    type: string
                primaryImage:
                    type: string
                productID:
                    type: string
                    format: uuid
                typeID:
                    type: number
                    format: int64
                vat:
                    type: string
            description: Создание или обновление товара в личном кабинете продавца Ozon (POST /v3/product/import). Обрабатывается асинхронно — ответ содержит номер задания (task_id).
        requestPlatformsAPICreateWildberriesCard:
            type: object
            required:
                - productID
                - subjectID
                - vendorCode
                - title
                - description
                - brand
                - kizMarked
                - wholesaleEnabled
                - wholesaleQuantum
                - dimensions
                - sizes
                - characteristics
                - documents
            properties:
                brand:
                    type: string
                characteristics:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.WildberriesCharacteristic'
                    nullable: true
                description:
                    type: string
                dimensions:
                    $ref: '#/components/schemas/models.WildberriesDimensions'
                documents:
