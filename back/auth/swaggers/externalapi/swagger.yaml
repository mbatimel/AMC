                    type: string
            description: Изменение пароля пользователя
        requestAuthAPIConfirmPasswordReset:
            type: object
            required:
                - token
                - newPassword
            properties:
                newPassword:
                    type: string
                token:
                    type: string
            description: Публичная ручка (без сессии) — токен из письма идентифицирует пользователя, старый пароль не требуется
        requestAuthAPILoginUser:
