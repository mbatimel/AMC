        models.DeleteCertificateResponse:
            type: object
            properties:
                deleted:
                    type: boolean
        models.DeleteLegalDocResponse:
            type: object
            properties:
                deleted:
                    type: boolean
        models.LegalDoc:
            type: object
            properties:
                current_version:
                    type: string
                file_url:
                    type: string
                id:
                    type: string
                name:
                    type: string
                updated_at:
                    type: string
                    format: date-time
        models.LegalDocVersion:
            type: object
            properties:
                author:
                    type: string
                created_at:
                    type: string
                    format: date-time
                file_url:
                    type: string
                id:
                    type: string
                    format: uuid
                summary:
                    type: string
                version:
                    type: string
