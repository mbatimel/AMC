components:
    schemas:
        models.AuditLogEntry:
            type: object
            properties:
                action:
                    type: string
                actorLabel:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                id:
                    type: string
                    format: uuid
        models.ListAuditLogResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.AuditLogEntry'
                    nullable: true
                total:
                    type: number
                    format: int
        models.ListSignupRequestsResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.SignupRequest'
                    nullable: true
        models.LoginResponse:
            type: object
            properties:
                role:
                    type: string
                userID:
                    type: string
                    format: uuid
        models.SessionResponse:
            type: object
            properties:
                role:
                    type: string
                userID:
                    type: string
                    format: uuid
        models.SignupRequest:
            type: object
            properties:
                company:
                    type: string
                contact:
                    type: string
                created_at:
                    type: string
                    format: date-time
                decided_at:
                    oneOf:
                        - type: string
                          format: date-time
                        - nullable: true
                email:
                    type: string
                id:
                    type: string
                    format: uuid
                inn:
                    type: string
                phone:
                    type: string
                reject_reason:
                    type: string
                status:
                    type: string
                type:
                    type: string
        requestAdminAPIApproveSignupRequest:
            type: object
        requestAdminAPICreateSignupRequest:
            type: object
            required:
                - company
                - inn
                - contact
                - email
                - phone
                - requestType
            properties:
                company:
                    type: string
                contact:
                    type: string
                email:
                    type: string
                inn:
                    type: string
                phone:
                    type: string
                requestType:
                    type: string
            description: Публичное создание заявки на регистрацию; модерируется в /v1/admin/signup-requests
        requestAdminAPIGetSession:
            type: object
        requestAdminAPIListAuditLog:
            type: object
        requestAdminAPIListSignupRequests:
            type: object
        requestAdminAPILogin:
            type: object
        requestAdminAPILogout:
            type: object
        requestAdminAPIRejectSignupRequest:
            type: object
            required:
                - reason
            properties:
                reason:
                    type: string
            description: Отклоняет заявку, удаляет аккаунт заявителя в users (если найден по email) и отправляет письмо с причиной отказа
        responseAdminAPIApproveSignupRequest:
            type: object
            required:
                - response
            properties:
                response:
                    $ref: '#/components/schemas/models.SignupRequest'
            description: Помечает заявку одобренной; аккаунт уже существует (регистрация мгновенная), ничего не создаётся
        responseAdminAPICreateSignupRequest:
            type: object
            required:
                - response
            properties:
                response:
                    $ref: '#/components/schemas/models.SignupRequest'
            description: Публичное создание заявки на регистрацию; модерируется в /v1/admin/signup-requests
        responseAdminAPIGetSession:
            type: object
            required:
                - response
            properties:
                response:
                    $ref: '#/components/schemas/models.SessionResponse'
            description: Проверка, что пользователь авторизован и имеет права администратора
        responseAdminAPIListAuditLog:
            type: object
            required:
                - response
            properties:
                response:
                    $ref: '#/components/schemas/models.ListAuditLogResponse'
            description: Список действий администраторов портала без возможности удаления
        responseAdminAPIListSignupRequests:
            type: object
            required:
                - response
            properties:
                response:
                    $ref: '#/components/schemas/models.ListSignupRequestsResponse'
            description: Возвращает заявки на регистрацию, опционально отфильтрованные по статусу
        responseAdminAPILogin:
            type: object
            required:
                - response
            properties:
                response:
                    $ref: '#/components/schemas/models.LoginResponse'
            description: Авторизация сотрудника портала по email и паролю
        responseAdminAPILogout:
            type: object
        responseAdminAPIRejectSignupRequest:
            type: object
            required:
                - response
            properties:
                response:
                    $ref: '#/components/schemas/models.SignupRequest'
            description: Отклоняет заявку, удаляет аккаунт заявителя в users (если найден по email) и отправляет письмо с причиной отказа
