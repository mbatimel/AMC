        models.GetUserResponse:
            type: object
            properties:
                user:
                    $ref: '#/components/schemas/models.User'
        models.ListFavoritesResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.Favorite'
                    nullable: true
        models.ListUserClientsResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.UserClientListItem'
                    nullable: true
        models.ListUsersResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
