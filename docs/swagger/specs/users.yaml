        models.Favorite:
            type: object
            properties:
                client_id:
                    type: string
                created_at:
                    type: string
                    format: date-time
                product_id:
                    type: string
                user_id:
                    type: string
        models.GetClientConditionsResponse:
            type: object
            properties:
                conditions:
                    $ref: '#/components/schemas/models.ClientConditions'
        models.GetClientDetailsResponse:
