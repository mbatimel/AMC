            type: object
            properties:
                address:
                    type: string
                company_name:
                    type: string
                company_type:
                    type: string
                contact_name:
                    type: string
                created_at:
                    type: string
                    format: date-time
                email:
                    type: string
                id:
                    type: string
                inn:
                    type: string
                ogrn:
                    type: string
                phone:
                    type: string
                updated_at:
                    type: string
                    format: date-time
        models.ClientConditions:
            type: object
            properties:
                category_discounts:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.CategoryDiscount'
                    nullable: true
                client_id:
