name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push-image:
    name: Push Docker image to ghcr
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: access
            dockerfile: ./back/access/Dockerfile
            image: ghcr.io/mbatimel/amc-access
          - name: migrations
            dockerfile: ./back/migrations/Dockerfile
            image: ghcr.io/mbatimel/amc-migrations
          - name: front
            dockerfile: ./front/Dockerfile
            image: ghcr.io/mbatimel/amc-front
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.EVENTIFY_MBATIMEL }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
