services:
  postgres:
    image: postgres:15.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [amc_net]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [amc_net]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set amc http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        mc mb --ignore-existing "amc/$${S3_BUCKET}"
        mc anonymous set download "amc/$${S3_BUCKET}"
    networks: [amc_net]

  migrations:
    image: ghcr.io/mbatimel/amc-migrations:${IMAGE_TAG}
    restart: "no"
    environment:
      PG_ADDRESS: postgres:5432
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [amc_net]
  auth:
    image: ghcr.io/mbatimel/amc-auth:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      API_FNS_ADDR: ${API_FNS_ADDR}
      API_FNS_KEY: ${API_FNS_KEY}
      BIND_ADDR: ":8081"
      ACCESS_URL: "http://access:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: [amc_net]

  access:
    image: ghcr.io/mbatimel/amc-access:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      ACCESS_INTERNAL_ADDRESS: ":8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: [amc_net]
  orders:
    image: ghcr.io/mbatimel/amc-orders:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      ACCESS_URL: "http://access:8080"
      NDS_VALUE: ${NDS_VALUE}
      INTEGRATIONS_URL: "http://onec-orders-api:8090"
      # Must stay > onec-orders-api's ONEC_ORDERS_REQUEST_TIMEOUT (15s): this
      # call wraps that one, and expiring first would roll the order back while
      # 1С may already have created the document.
      INTEGRATIONS_TIMEOUT: "20s"
    depends_on:
      migrations:
        condition: service_completed_successfully
      onec-orders-api:
        condition: service_started
    networks: [amc_net]

  users:
    image: ghcr.io/mbatimel/amc-users:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      BIND_ADDR: ":8083"
      ACCESS_URL: "http://access:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      access:
        condition: service_started
    networks: [amc_net]

  admin:
    image: ghcr.io/mbatimel/amc-admin:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      BIND_ADDR: ":8084"
      ACCESS_URL: "http://access:8080"
      AUTH_URL: "http://auth:8081"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: "false"
      S3_MAX_FILE_SIZE: ${S3_MAX_FILE_SIZE}
    depends_on:
      migrations:
        condition: service_completed_successfully
      access:
        condition: service_started
      auth:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks: [amc_net]

  products:
    image: ghcr.io/mbatimel/amc-products:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      BIND_ADDR: ":8085"
      ACCESS_URL: "http://access:8080"
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: "false"
      S3_MAX_FILE_SIZE: ${S3_MAX_FILE_SIZE}
    depends_on:
      migrations:
        condition: service_completed_successfully
      access:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks: [amc_net]

  onec-sync:
    image: ghcr.io/mbatimel/amc-onec-sync:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      HEALTH_ADDR: ":9096"
      ONEC_BASE_URL: ${ONEC_BASE_URL}
      ONEC_USER: ${ONEC_USER}
      ONEC_PASSWORD: ${ONEC_PASSWORD}
      SYNC_INTERVAL: "24h"
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: [amc_net]

  onec-orders-api:
    image: ghcr.io/mbatimel/amc-onec-orders-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      ONEC_ORDERS_BIND_ADDR: ":8090"
      ONEC_ORDERS_BASE_URL: ${ONEC_ORDERS_BASE_URL}
      ONEC_ORDERS_USER: ${ONEC_ORDERS_USER}
      ONEC_ORDERS_PASSWORD: ${ONEC_ORDERS_PASSWORD}
      ONEC_ORDERS_REQUEST_TIMEOUT: "15s"
      ONEC_WEBHOOK_API_KEY: ${ONEC_WEBHOOK_API_KEY}
      ORDERS_URL: "http://orders:8082"
      ORDERS_SYSTEM_USER_ID: "00000000-0000-0000-0000-0000000a0ec1"
    depends_on:
      migrations:
        condition: service_completed_successfully
      access:
        condition: service_started
    networks: [amc_net]

  front:
    image: ghcr.io/mbatimel/amc-front:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # ИИ-помощник: пустой ключ -> работает поиск по каталогу и сценарии
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      # Контент, баннеры, заявки, обращения и отзывы (см. front/src/app/portal-api)
      PORTAL_DATA_FILE: /data/portal.json
    volumes:
      - front_portal_data:/data
    depends_on:
      - access
    networks: [amc_net]

  admin-front:
    image: ghcr.io/mbatimel/amc-admin-front:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      API_PROXY_TARGET: "https://wk.amctechgroup.ru"
      PORTAL_API_PROXY_TARGET: "https://wk.amctechgroup.ru"
      NEXT_PUBLIC_SITE_ORIGIN: "https://wk.amctechgroup.ru"
    depends_on:
      - access
      - front
    networks: [amc_net]

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    environment:
      BASE_URL: /docs
      URLS: >-
        [
          {"url": "/docs/specs/access.yaml", "name": "Access (internal)"},
          {"url": "/docs/specs/admin.yaml", "name": "Admin"},
          {"url": "/docs/specs/auth.yaml", "name": "Auth"},
          {"url": "/docs/specs/orders.yaml", "name": "Orders"},
          {"url": "/docs/specs/products.yaml", "name": "Products"},
          {"url": "/docs/specs/users.yaml", "name": "Users"}
        ]
    volumes:
      - ../back/access/swaggers/internalapi/swagger.yaml:/usr/share/nginx/html/specs/access.yaml:ro
      - ../back/admin/swaggers/externalapi/swagger.yaml:/usr/share/nginx/html/specs/admin.yaml:ro
      - ../back/auth/swaggers/externalapi/swagger.yaml:/usr/share/nginx/html/specs/auth.yaml:ro
      - ../back/orders/swaggers/externalapi/swagger.yaml:/usr/share/nginx/html/specs/orders.yaml:ro
      - ../back/products/swaggers/externalapi/swagger.yaml:/usr/share/nginx/html/specs/products.yaml:ro
      - ../back/users/swaggers/externalapi/swagger.yaml:/usr/share/nginx/html/specs/users.yaml:ro
    networks: [amc_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - access
      - admin
      - auth
      - orders
      - products
      - users
      - front
      - swagger-ui
      - admin-front
      - onec-orders-api
    networks: [amc_net]

volumes:
  postgres_data:
  minio_data:
  front_portal_data:

networks:
  amc_net:
