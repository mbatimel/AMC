services:
  postgres:
    image: postgres:15.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [amc_net]

  migrations:
    image: ghcr.io/mbatimel/amc-migrations:${IMAGE_TAG}
    restart: "no"
    environment:
      PG_ADDRESS: postgres:5432
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [amc_net]
  auth:
    image: ghcr.io/mbatimel/amc-auth:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      BIND_ADDR: ":8081"
      ACCESS_URL: "http://access:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: [amc_net]

  access:
    image: ghcr.io/mbatimel/amc-access:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      ACCESS_INTERNAL_ADDRESS: ":8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: [amc_net]
  orders:
    image: ghcr.io/mbatimel/amc-orders:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      ACCESS_URL: "http://access:8080"
      NDS_VALUE: ${NDS_VALUE}
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: [amc_net]

  users:
    image: ghcr.io/mbatimel/amc-users:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      BIND_ADDR: ":8083"
      ACCESS_URL: "http://access:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      access:
        condition: service_started
    networks: [amc_net]

  admin:
    image: ghcr.io/mbatimel/amc-admin:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      BIND_ADDR: ":8084"
      ACCESS_URL: "http://access:8080"
      AUTH_URL: "http://auth:8081"
    depends_on:
      migrations:
        condition: service_completed_successfully
      access:
        condition: service_started
      auth:
        condition: service_started
    networks: [amc_net]

  products:
    image: ghcr.io/mbatimel/amc-products:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      BIND_ADDR: ":8085"
      ACCESS_URL: "http://access:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      access:
        condition: service_started
    networks: [amc_net]

  front:
    image: ghcr.io/mbatimel/amc-front:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - access
    networks: [amc_net]

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    environment:
      BASE_URL: /docs
      URLS: >-
        [
          {"url": "/docs/specs/access.yaml", "name": "Access (internal)"},
          {"url": "/docs/specs/admin.yaml", "name": "Admin"},
          {"url": "/docs/specs/auth.yaml", "name": "Auth"},
          {"url": "/docs/specs/orders.yaml", "name": "Orders"},
          {"url": "/docs/specs/products.yaml", "name": "Products"},
          {"url": "/docs/specs/users.yaml", "name": "Users"}
        ]
    volumes:
      - ../back/access/swaggers/internalapi/swagger.yaml:/usr/share/nginx/html/specs/access.yaml:ro
      - ../back/admin/swaggers/externalapi/swagger.yaml:/usr/share/nginx/html/specs/admin.yaml:ro
      - ../back/auth/swaggers/externalapi/swagger.yaml:/usr/share/nginx/html/specs/auth.yaml:ro
      - ../back/orders/swaggers/externalapi/swagger.yaml:/usr/share/nginx/html/specs/orders.yaml:ro
      - ../back/products/swaggers/externalapi/swagger.yaml:/usr/share/nginx/html/specs/products.yaml:ro
      - ../back/users/swaggers/externalapi/swagger.yaml:/usr/share/nginx/html/specs/users.yaml:ro
    networks: [amc_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - access
      - admin
      - auth
      - orders
      - products
      - users
      - front
      - swagger-ui
    networks: [amc_net]

volumes:
  postgres_data:

networks:
  amc_net:
